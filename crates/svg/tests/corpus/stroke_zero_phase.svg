<svg xmlns="http://www.w3.org/2000/svg" width="210" height="60">
  <!-- Original SVG offset controls. Omitted offset is zero, not native automatic fitting. -->
  <line id="omitted-offset" x1="10" y1="10" x2="190" y2="10" stroke="#000000" stroke-width="4" stroke-dasharray="20 10"/>
  <line id="explicit-zero" x1="10" y1="30" x2="190" y2="30" stroke="#000000" stroke-width="4" stroke-dasharray="20 10" stroke-dashoffset="0"/>
  <line id="explicit-half-dash" x1="10" y1="50" x2="190" y2="50" stroke="#000000" stroke-width="4" stroke-dasharray="20 10" stroke-dashoffset="10"/>
  <!-- Zero starts with a complete20-unit dash and leaves the final gap intact. -->
  <!-- probe 15 10 #000000ff -->
  <!-- probe 25 10 #000000ff -->
  <!-- probe 35 10 #00000000 -->
  <!-- probe 45 10 #000000ff -->
  <!-- probe 55 10 #000000ff -->
  <!-- probe 185 10 #00000000 -->
  <!-- probe 15 30 #000000ff -->
  <!-- probe 25 30 #000000ff -->
  <!-- probe 35 30 #00000000 -->
  <!-- probe 45 30 #000000ff -->
  <!-- probe 55 30 #000000ff -->
  <!-- probe 185 30 #00000000 -->
  <!-- Offset10 advances into the dash and yields half-dashes at both path ends. -->
  <!-- probe 15 50 #000000ff -->
  <!-- probe 25 50 #00000000 -->
  <!-- probe 35 50 #000000ff -->
  <!-- probe 45 50 #000000ff -->
  <!-- probe 55 50 #00000000 -->
  <!-- probe 185 50 #000000ff -->
</svg>
