[package]
name = "craft-print-ui"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/storytold/craft-libs"
[workspace]
[dependencies]
craft-ui = { git = "https://github.com/storytold/craft-libs", rev = "e11f9d9aebea5f6b8e74643c1ea1ed172ba5f545" }
egui = { version = "0.37", default-features = false }

# Standalone dependency tests use the same immutable egui family as the parent application.
