[workspace]
resolver = "3"
members = ["crates/print", "crates/job", "crates/wsd"]
[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/storytold/craft-libs"
[workspace.dependencies]
craft-job = { path = "crates/job", version = "0.1.0" }
craft-wsd = { path = "crates/wsd", version = "0.1.0" }
thiserror = "2"
roxmltree = "0.21"
ureq = { version = "3.4", default-features = false }
[workspace.lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(craft_pdf_unicode_fixtures)"] }
[workspace.lints.clippy]
cognitive_complexity = "deny"
too_many_arguments = "deny"
wildcard_imports = "deny"
dbg_macro = "warn"
todo = "warn"
