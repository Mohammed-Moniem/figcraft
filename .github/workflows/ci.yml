name: CI

# Run the shared quality gate on both maintained branches and on pull requests.
on:
  push:
    branches: [main, fix/github-issues]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer PR update cancels its older run. Each branch push gets its own run.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    # Tracks @main so suite-wide CI fixes reach every app without a PR in each repository.
    uses: storytold/craft-common-actions/.github/workflows/gate.yml@main
    with:
      # Combined Latin presentation and core UI catalog. Required web builds enforce
      # Inter Regular/SemiBold and Noto Sans Georgian Regular after asset-policy filtering.
      craft-fonts-ref: 37827adc41fd165f9a9234ac40f94dbad353aa69
      require-craft-fonts: true
      packages: >-
        libxkbcommon-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev
        libgtk-3-dev
